# Prefix
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Base behavior
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
set-option -g escape-time 10
set-option -g focus-events on
set-option -g mouse on
set-option -g renumber-windows on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi

# Windows and panes
bind-key q kill-window
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H resize-pane -L 5
bind-key J resize-pane -D 3
bind-key K resize-pane -U 3
bind-key L resize-pane -R 5
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Theme: noctalia amber
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-justify left
set-option -g status-style "bg=#121212,fg=#e8e6e3"
set-option -g status-left-length 32
set-option -g status-right-length 96
set-option -g status-left "#[fg=#121212,bg=#facc15,bold] #S #[fg=#facc15,bg=#121212]"
set-option -g status-right "#[fg=#8a8f98]#(whoami) #[fg=#2a2a2a]│ #[fg=#ffd54a]%a %b %d #[fg=#fff4cc]%I:%M %p "

set-window-option -g window-status-separator ""
set-window-option -g window-status-format "#[fg=#8a8f98,bg=#121212]  #I:#W  "
set-window-option -g window-status-current-format "#[fg=#121212,bg=#e6b450,bold] #I:#W #[fg=#e6b450,bg=#121212]"
set-window-option -g window-status-activity-style "fg=#facc15,bg=#121212"

set-option -g pane-border-style "fg=#2a2a2a"
set-option -g pane-active-border-style "fg=#facc15"
set-option -g message-style "bg=#2a2a2a,fg=#fff4cc"
set-option -g message-command-style "bg=#2a2a2a,fg=#facc15"
set-option -g mode-style "bg=#facc15,fg=#121212"
